apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: cinepass-dev
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: cinepass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html-volume
          configMap:
            name: cinepass-frontend-assets
        - name: nginx-config
          configMap:
            name: cinepass-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: cinepass-dev
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: cinepass
spec:
  type: ClusterIP
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 80
      name: http
---
# NGINX config: serve static files, let ALB handle /api/* routing
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinepass-nginx-config
  namespace: cinepass-dev
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Health check endpoint for ALB
      location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
      }

      # Serve static frontend for all non-/api routes
      location / {
        try_files $uri $uri/ /index.html;
      }

      # /api/* — these are handled by ALB ingress routing to backend services
      # NGINX should NOT try to serve files for /api paths
      # ALB routes /api/* BEFORE hitting frontend, so this block
      # is only a safety fallback (should never be reached via ALB)
      location /api/ {
        return 503 '{"error":"API backend not reachable directly via frontend pod"}';
        add_header Content-Type application/json;
      }
    }
