apiVersion: v1
kind: ConfigMap
metadata:
  name: cinepass-frontend-assets
  namespace: cinepass-dev
  labels:
    app.kubernetes.io/part-of: cinepass
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CinePass | India's Premier Cinema Ticketing Platform</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
      <style>
    :root {
      --bg-dark: #090d16;
      --bg-darker: #05070b;
      --bg-card: #121826;
      --bg-card-hover: #182032;
      --bg-panel: #161e30;
    
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(229, 9, 20, 0.4);
    
      --red: #E50914;
      --red-hover: #ff1f2d;
      --cyan: #06B6D4;
      --gold: #F59E0B;
      --green: #10B981;
    
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
    
      --font-main: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
      line-height: 1.5;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    
    /* ============================================================================
       1. Top Announcement Bar
       ============================================================================ */
    .top-bar {
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.4rem 0;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .top-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    
    .live-pulse {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }
    
    .sep {
      color: var(--border-subtle);
    }
    
    .top-links {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    
    .link-item {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .link-item:hover {
      color: #fff;
    }
    
    .btn-admin-nav {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(229, 9, 20, 0.12);
      color: #ff4d58;
      border: 1px solid rgba(229, 9, 20, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-admin-nav:hover {
      background: var(--red);
      color: #fff;
    }
    
    /* ============================================================================
       2. Main Navigation Bar
       ============================================================================ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.8rem 0;
    }
    
    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .logo .highlight {
      color: var(--red);
    }
    
    .search-box {
      flex: 1;
      max-width: 520px;
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .search-box svg {
      position: absolute;
      left: 1rem;
    }
    
    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
    }
    
    .search-box input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--red);
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
    }
    
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    
    .city-selector-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .city-selector-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--red);
    }
    
    .btn-signin {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.55rem 1.4rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-signin:hover {
      background: var(--red-hover);
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    
    .user-logged-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
    }
    
    .user-logged-badge .u-avatar {
      width: 26px;
      height: 26px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
    }
    
    .user-logged-badge .u-name {
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    /* Secondary Sub-Navbar */
    .sub-nav {
      background: #0d121d;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.5rem 0;
      font-size: 0.82rem;
    }
    
    .sub-nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sub-nav-links {
      display: flex;
      gap: 1.8rem;
    }
    
    .sub-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    
    .sub-link:hover, .sub-link.active {
      color: #fff;
      border-bottom: 2px solid var(--red);
      padding-bottom: 4px;
    }
    
    .tag-promo {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.75rem;
    }
    
    /* ============================================================================
       3. Hero Spotlight Section
       ============================================================================ */
    .hero-spotlight {
      position: relative;
      min-height: 480px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }
    
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.65);
      transition: background-image 0.5s ease;
    }
    
    .hero-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #090d16 25%, rgba(9, 13, 22, 0.85) 60%, transparent 100%),
                  linear-gradient(0deg, #090d16 0%, transparent 60%);
    }
    
    .hero-layout {
      position: relative;
      z-index: 2;
      padding-top: 3rem;
      padding-bottom: 3rem;
    }
    
    .hero-info {
      max-width: 680px;
    }
    
    .hero-tag-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    
    .hero-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
    }
    
    .hero-pill.red {
      background: rgba(229, 9, 20, 0.2);
      color: #ff4d58;
      border: 1px solid rgba(229, 9, 20, 0.4);
    }
    
    .hero-pill.glass {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .hero-heading {
      font-family: var(--font-main);
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.7rem;
      color: #fff;
    }
    
    .hero-stats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    
    .rating-star {
      color: var(--gold);
      font-weight: 800;
    }
    
    .votes {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .bullet {
      color: var(--border-subtle);
    }
    
    .hero-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
    }
    
    .hero-synopsis {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }
    
    .hero-cta-group {
      display: flex;
      gap: 1rem;
    }
    
    .btn-hero-book {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      color: #fff;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
      transition: all 0.2s;
    }
    
    .btn-hero-book:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(229, 9, 20, 0.6);
    }
    
    .btn-hero-trailer {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.8rem 1.4rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    
    .btn-hero-trailer:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    
    /* ============================================================================
       4. Movie Catalog Grid
       ============================================================================ */
    .main-content {
      padding-top: 3rem;
      padding-bottom: 4rem;
    }
    
    .catalog-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    
    .section-heading {
      font-family: var(--font-main);
      font-size: 1.8rem;
      font-weight: 700;
    }
    
    .section-sub {
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    
    .lang-pills {
      display: flex;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    
    .filter-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-pill.active, .filter-pill:hover {
      background: var(--red);
      color: #fff;
    }
    
    /* Cards Grid */
    .movie-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.8rem;
    }
    
    .movie-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
    }
    
    .movie-card:hover {
      transform: translateY(-5px);
      border-color: rgba(229, 9, 20, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    
    .poster-box {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
      background: #0d121d;
    }
    
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    
    .movie-card:hover .poster-box img {
      transform: scale(1.04);
    }
    
    .score-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.9);
      padding: 3px 7px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--gold);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .lang-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
    }
    
    .card-details {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .c-title {
      font-family: var(--font-main);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .c-genre {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }
    
    .btn-card-book {
      width: 100%;
      background: rgba(229, 9, 20, 0.12);
      color: #ff4d58;
      border: 1px solid rgba(229, 9, 20, 0.3);
      padding: 0.55rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-card-book:hover {
      background: var(--red);
      color: #fff;
    }
    
    /* ============================================================================
       5. Modals Common
       ============================================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal-card {
      background: #0f1523;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      width: 100%;
      max-width: 940px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .close-btn:hover {
      background: var(--red);
    }
    
    .modal-top-right {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 10;
    }
    
    /* City Picker Modal */
    .city-card {
      max-width: 580px;
      padding: 2rem;
    }
    
    .modal-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    
    .city-search input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      outline: none;
    }
    
    .popular-cities-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    
    .city-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
    }
    
    .city-item-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.8rem;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .city-item-btn:hover, .city-item-btn.selected {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    /* ============================================================================
       6. Theater Seat Booking Modal
       ============================================================================ */
    .booking-top-panel {
      padding: 1.6rem 2rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .eks-sync-badge {
      font-size: 0.65rem;
      background: rgba(16, 185, 129, 0.12);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    
    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 3px;
    }
    
    .seat-timer-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }
    
    .timer-text {
      font-size: 0.62rem;
      color: #fca5a5;
      font-weight: 700;
    }
    
    .timer-digits {
      font-size: 1rem;
      font-weight: 800;
      font-family: var(--font-main);
      color: #ef4444;
    }
    
    .selection-bar {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    
    .select-field {
      flex: 1;
    }
    
    .select-field label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }
    
    .select-field select {
      width: 100%;
      background: #182235;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    
    .showtimes-row {
      display: flex;
      gap: 0.4rem;
    }
    
    .time-btn {
      background: #182235;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .time-btn.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    /* 3D Cinema Hall Screen */
    .theater-hall {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 15%, rgba(6, 182, 212, 0.06), transparent 70%);
    }
    
    .curved-screen-container {
      perspective: 400px;
      margin-bottom: 2.2rem;
      text-align: center;
    }
    
    .curved-screen {
      width: 360px;
      height: 18px;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.1) 100%);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
      transform: rotateX(-35deg);
    }
    
    .screen-caption {
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 0.6rem;
      font-weight: 700;
    }
    
    /* Seat Matrix */
    .seat-matrix {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.8rem;
    }
    
    .tier-title-row {
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 0.5rem 0 0.2rem;
      font-weight: 700;
    }
    
    .s-row {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }
    
    .r-label {
      width: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }
    
    .s-seat {
      width: 26px;
      height: 24px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px 5px 2px 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      color: var(--text-muted);
      font-weight: 600;
      transition: all 0.15s ease;
      user-select: none;
    }
    
    .s-seat:hover:not(.booked):not(.locked) {
      background: #334155;
      transform: scale(1.15);
      border-color: #94a3b8;
    }
    
    .s-seat.selected {
      background: var(--red);
      color: #fff;
      border-color: var(--red-hover);
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.7);
      transform: scale(1.1);
    }
    
    .s-seat.locked {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold);
      color: var(--gold);
      cursor: not-allowed;
    }
    
    .s-seat.booked {
      background: #090d16;
      border-color: transparent;
      color: #334155;
      cursor: not-allowed;
      opacity: 0.4;
    }
    
    .seat-indicators {
      display: flex;
      gap: 1.2rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .ind-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    
    .seat-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    
    .seat-dot.available { background: #1e293b; border: 1px solid #475569; }
    .seat-dot.selected { background: var(--red); }
    .seat-dot.locked { background: var(--gold); }
    .seat-dot.booked { background: #334155; opacity: 0.4; }
    
    /* Booking Bottom Bar */
    .booking-bottom-bar {
      padding: 1.2rem 2rem;
      background: #0a0e18;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .summary-info {
      display: flex;
      gap: 2rem;
    }
    
    .sub-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
    }
    
    .seat-names-display {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }
    
    .total-bill-display {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: var(--font-main);
      color: var(--green);
    }
    
    .btn-pay-now {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      color: #fff;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-pay-now:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    
    .btn-pay-now:not(:disabled):hover {
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
      transform: translateY(-2px);
    }
    
    /* ============================================================================
       7. Customer Auth Modal
       ============================================================================ */
    .auth-card {
      max-width: 440px;
      padding: 2rem;
    }
    
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1.5rem;
    }
    
    .auth-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .auth-tab.active {
      color: var(--red);
      border-bottom: 2px solid var(--red);
    }
    
    .auth-body h3 {
      font-family: var(--font-main);
      font-size: 1.3rem;
      margin-bottom: 0.3rem;
    }
    
    .auth-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1.1rem;
    }
    
    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      background: #182235;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }
    
    .form-group input:focus {
      border-color: var(--red);
    }
    
    .btn-auth-submit {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    
    .btn-auth-submit:hover {
      background: var(--red-hover);
    }
    
    /* ============================================================================
       8. Theater Admin Console Modal
       ============================================================================ */
    .admin-card {
      max-width: 980px;
      padding: 2rem;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }
    
    .admin-badge {
      font-size: 0.65rem;
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 0.3rem;
    }
    
    .admin-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    
    .kpi-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      border-radius: 10px;
    }
    
    .kpi-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      margin-bottom: 0.3rem;
    }
    
    .kpi-num {
      font-family: var(--font-main);
      font-size: 1.6rem;
      font-weight: 800;
      display: block;
    }
    
    .kpi-trend {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    
    .text-green { color: var(--green) !important; }
    .text-cyan { color: var(--cyan) !important; }
    .text-gold { color: var(--gold) !important; }
    .text-red { color: var(--red) !important; }
    
    .admin-actions-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      border-radius: 10px;
      margin-bottom: 2rem;
    }
    
    .admin-actions-section h3 {
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }
    
    .input-row {
      display: flex;
      gap: 0.6rem;
    }
    
    .input-row input {
      flex: 2;
      background: #182235;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.55rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    
    .input-row select {
      flex: 1;
      background: #182235;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    
    .btn-admin-add {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    /* Microservices Telemetry Table */
    .admin-services-table h3 {
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }
    
    .services-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    
    .services-tbl th {
      text-align: left;
      padding: 0.6rem;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .services-tbl td {
      padding: 0.65rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }
    
    .badge-status-up {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.68rem;
    }
    
    /* ============================================================================
       9. Boarding Pass Ticket
       ============================================================================ */
    .ticket-pass-card {
      max-width: 440px;
      padding: 0;
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }
    
    .ticket-head {
      padding: 1.8rem;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    
    .ticket-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      font-weight: 800;
      font-size: 1.1rem;
    }
    
    .verified-pill {
      font-size: 0.65rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 700;
    }
    
    .ticket-cutout-divider {
      position: relative;
      height: 24px;
      background: #0f1523;
      display: flex;
      align-items: center;
    }
    
    .cutout-circle {
      width: 24px;
      height: 24px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 50%;
      position: absolute;
      top: 0;
    }
    .cutout-circle.left { left: -12px; }
    .cutout-circle.right { right: -12px; }
    
    .cutout-dash {
      width: 100%;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
    }
    
    .ticket-body {
      padding: 1.5rem 1.8rem 1.8rem;
    }
    
    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    
    .tk-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }
    
    .tk-val {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }
    
    .font-mono { font-family: monospace; letter-spacing: 0.5px; }
    
    .ticket-qr-box {
      display: flex;
      gap: 1rem;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }
    
    .qr-canvas {
      width: 80px;
      height: 80px;
      background: #fff;
      border-radius: 6px;
      padding: 4px;
      flex-shrink: 0;
    }
    
    .qr-code {
      width: 100%;
      height: 100%;
    }
    
    .qr-instructions h4 {
      font-size: 0.82rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    
    .qr-instructions p {
      font-size: 0.72rem;
      color: var(--text-secondary);
      line-height: 1.35;
    }
    
    .btn-ticket-done {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-ticket-done:hover {
      background: #059669;
    }
    
    /* ============================================================================
       10. Footer
       ============================================================================ */
    .footer {
      background: var(--bg-darker);
      border-top: 1px solid var(--border-subtle);
      padding: 3rem 0 2rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    
    .footer-inner {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 3rem;
      margin-bottom: 2rem;
    }
    
    .footer-desc {
      margin-top: 0.8rem;
      line-height: 1.6;
      max-width: 400px;
    }
    
    .footer-col h4 {
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }
    
    .footer-col ul {
      list-style: none;
    }
    
    .footer-col li {
      margin-bottom: 0.4rem;
    }
    
    .footer-bottom {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.5rem;
    }
    
    /* ── API Status Banner ─────────────────────────────────────────────────── */
    .api-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      position: sticky;
      top: 0;
      z-index: 200;
      transition: background 0.3s;
    }
    .api-banner--ok   { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border-bottom: 1px solid rgba(16,185,129,.2); }
    .api-banner--warn { background: rgba(245, 158, 11, 0.12); color: #fcd34d; border-bottom: 1px solid rgba(245,158,11,.2); }
    
    /* ── Live Health Dots ──────────────────────────────────────────────────── */
    .h-dot {
      font-size: 1.1rem;
      transition: color 0.4s;
      cursor: help;
    }
    .h-dot--up   { color: #22c55e; }
    .h-dot--down { color: #ef4444; }
    
    /* ── Poster Hover Overlay ─────────────────────────────────────────────── */
    .poster-box { position: relative; overflow: hidden; }
    .poster-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5,7,11,.95) 0%, rgba(5,7,11,.5) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .movie-card:hover .poster-overlay { opacity: 1; }
    .overlay-synopsis {
      font-size: 0.72rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }
    .btn-overlay-book {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-overlay-book:hover { background: var(--red-hover); }
    
    /* ── Movie Card Meta ──────────────────────────────────────────────────── */
    .c-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      margin-bottom: 0.4rem;
    }
    
    /* ── Toast Slide Animation ────────────────────────────────────────────── */
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    
    /* ── Admin Refresh Button ─────────────────────────────────────────────── */
    .admin-top-actions {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .btn-refresh-health {
      background: rgba(6, 182, 212, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(6,182,212,.3);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-refresh-health:hover { background: rgba(6,182,212,.22); }
    
    </style>
    </head>
