apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-service-sa
  namespace: cinepass-dev
  labels:
    app: booking-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: cinepass-dev
  labels:
    app: booking-service
    app.kubernetes.io/part-of: cinepass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      serviceAccountName: booking-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: booking-service
          image: 304960798044.dkr.ecr.ap-south-2.amazonaws.com/cinepass-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          # Ingest shared environment from centralized ConfigMap
          envFrom:
            - configMapRef:
                name: cinepass-config
          # Ingest sensitive database credentials from Kubernetes Secret
          env:
            - name: PORT
              value: "8082"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cinepass-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: cinepass-dev
  labels:
    app: booking-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: booking-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: cinepass-dev
  labels:
    app: booking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
