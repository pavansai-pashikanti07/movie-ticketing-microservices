apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinepass-ingress
  namespace: cinepass-dev
  labels:
    app.kubernetes.io/part-of: cinepass
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200-399'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Auth Service — /api/auth/* → auth-service:8080
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080

          # Catalog Service — /api/catalog/* → catalog-service:8081
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8081

          # Booking Service — /api/bookings/* → booking-service:8082
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8082

          # Payment Service — /api/payments/* → payment-service:8083
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8083

          # Notification Service — /api/notifications/* → notification-service:8084
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8084

          # Frontend — catch-all: / and all non-api paths → frontend-service:80
          # NOTE: must be LAST so specific /api/* rules match first
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
