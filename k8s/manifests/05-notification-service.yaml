apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: cinepass-dev
  labels:
    app: notification-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::304960798044:role/cinepass-dev-app-services-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cinepass-dev
  labels:
    app: notification-service
    app.kubernetes.io/part-of: cinepass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: notification-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: notification-service
          image: 304960798044.dkr.ecr.ap-south-2.amazonaws.com/cinepass/notification-service:1e0031ca8352546c207e226a992e2f80a109613e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          # Ingest shared environment from centralized ConfigMap
          envFrom:
            - configMapRef:
                name: cinepass-config
          # Ingest sensitive database credentials from Kubernetes Secret
          env:
            - name: PORT
              value: "8084"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cinepass-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cinepass-dev
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
      name: http
  selector:
    app: notification-service
