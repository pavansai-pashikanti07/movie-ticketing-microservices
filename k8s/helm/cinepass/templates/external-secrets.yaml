apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cinepass-aws-secrets-store
  labels:
    {{- include "cinepass.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: auth-service-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cinepass-credentials-sync
  labels:
    {{- include "cinepass.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cinepass-aws-secrets-store
    kind: SecretStore
  target:
    name: cinepass-dev-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: cinepass/dev/credentials
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: cinepass/dev/credentials
        property: JWT_SECRET
