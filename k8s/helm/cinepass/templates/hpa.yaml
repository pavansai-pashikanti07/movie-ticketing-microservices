{{- if .Values.services.booking.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  labels:
    {{- include "cinepass.labels" . | nindent 4 }}
    app: booking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: {{ .Values.services.booking.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.services.booking.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.services.booking.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.booking.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.services.booking.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.booking.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
