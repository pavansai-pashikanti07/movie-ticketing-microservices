# 1. Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    {{- include "cinepass.labels" . | nindent 4 }}
    app: auth-service
spec:
  replicas: {{ .Values.services.auth.replicaCount }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: auth-service
          image: "{{ .Values.global.imageRegistry }}/cinepass-auth-service:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.auth.port }}
              name: http
          envFrom:
            - configMapRef:
                name: cinepass-config
          env:
            - name: PORT
              value: "{{ .Values.services.auth.port }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName }}
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.services.auth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.auth.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.auth.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
