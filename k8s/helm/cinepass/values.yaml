# Default values for CinePass Enterprise Helm Chart
global:
  environment: dev
  region: ap-south-2
  imageRegistry: 304960798044.dkr.ecr.ap-south-2.amazonaws.com
  imageTag: latest
  imagePullPolicy: IfNotPresent

# Common Database & Caching Connections
database:
  host: cinepass-dev-db.cbgayocyy127.ap-south-2.rds.amazonaws.com
  port: 5432
  user: cinepass_admin
  name: cinepass
  passwordSecretName: cinepass-dev-credentials
  passwordKey: DB_PASSWORD

redis:
  host: cinepass-dev-redis.cbgayocyy127.ap-south-2.cache.amazonaws.com
  port: 6379

aws:
  sqsQueueUrl: https://sqs.ap-south-2.amazonaws.com/304960798044/cinepass-dev-booking-queue
  s3BucketName: cinepass-assets-07784
  cloudfrontDomain: https://assets.cinepass.com
  iamRoles:
    appServices: arn:aws:iam::304960798044:role/cinepass-dev-app-services-role
    externalSecrets: arn:aws:iam::304960798044:role/cinepass-dev-external-secrets-role

# -----------------------------------------------------------------------------
# Microservices Specifications
# -----------------------------------------------------------------------------
services:
  auth:
    name: auth-service
    replicaCount: 2
    port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  catalog:
    name: catalog-service
    replicaCount: 2
    port: 8081
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  booking:
    name: booking-service
    replicaCount: 2
    port: 8082
    seatLockTtlSeconds: 300
    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  payment:
    name: payment-service
    replicaCount: 2
    port: 8083
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  notification:
    name: notification-service
    replicaCount: 2
    port: 8084
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 384Mi

# -----------------------------------------------------------------------------
# Ingress (AWS Application Load Balancer Controller)
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
