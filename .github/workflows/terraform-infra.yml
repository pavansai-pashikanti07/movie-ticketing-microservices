name: "Terraform Infrastructure Automation"

on:
  # schedule:
  #   # 00:20 UTC is 05:50 AM IST (Early Morning Auto-Recreate)
  #   - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  TF_VERSION: "1.10.0"
  WORKING_DIR: "infrastructure/terraform/env/dev"

jobs:
  terraform:
    name: "Terraform ${{ github.event.inputs.action || 'Scheduled Apply' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Populate terraform.tfvars from Secret
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TFVARS_CONTENT: ${{ secrets.TFVARS_DEV }}
        run: |
          printf '%s\n' "$TFVARS_CONTENT" > terraform.tfvars

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        if: "${{ github.event_name == 'schedule' || github.event.inputs.action == 'apply' }}"
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply -auto-approve || (echo "Retrying Terraform apply to resolve any transient cloud/helm timing..." && sleep 15 && terraform apply -auto-approve)

      - name: Configure Kubeconfig & Deploy GitOps & Observability
        if: "${{ github.event_name == 'schedule' || github.event.inputs.action == 'apply' }}"
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name cinepass-dev-eks
          kubectl get nodes -o wide

          echo ">>> [1/4] Installing Kubernetes Metrics Server for HPA..."
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml || true

          echo ">>> [2/4] Deploying Argo CD Application (Bootstrapping GitOps)..."
          kubectl apply -f k8s/gitops/argo-application.yaml || (sleep 10 && kubectl apply -f k8s/gitops/argo-application.yaml)

          echo ">>> [3/4] Deploying Observability ServiceMonitors & Alert Rules..."
          kubectl apply -f k8s/monitoring/servicemonitors.yaml || (sleep 10 && kubectl apply -f k8s/monitoring/servicemonitors.yaml)
          kubectl apply -f k8s/monitoring/prometheus-rules.yaml || (sleep 10 && kubectl apply -f k8s/monitoring/prometheus-rules.yaml)

          echo ">>> [4/4] Waiting 30s for Argo CD to start GitOps sync..."
          sleep 30

          echo "=== Argo CD Applications ==="
          kubectl get applications.argoproj.io -n argocd || true
          echo "=== Pods in cinepass-dev ==="
          kubectl get pods -n cinepass-dev -o wide || true
          echo "=== Pods in monitoring ==="
          kubectl get pods -n monitoring || true

      - name: Generate GitHub Step Summary
        if: "${{ github.event_name == 'schedule' || github.event.inputs.action == 'apply' }}"
        run: |
          echo "Waiting up to 60s for ALB DNS to propagate..."
          ALB_HOSTNAME=""
          for i in {1..12}; do
            ALB_HOSTNAME=$(kubectl get ingress cinepass-ingress -n cinepass-dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB_HOSTNAME" ]; then
              break
            fi
            sleep 5
          done

          ARGO_PASS=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 --decode || echo "N/A")

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎬 CinePass Cloud Infrastructure & Services Summary

          ### 🌐 Application & UI Access
          * **Cinema Web UI**: [http://${ALB_HOSTNAME}](http://${ALB_HOSTNAME})
          * **ALB Hostname**: \`${ALB_HOSTNAME:-"Provisioning in AWS..."}\`

          ---

          ### 🔑 Endpoints & Credentials
          | Service | URL / Port / Access | Credentials |
          | :--- | :--- | :--- |
          | **Frontend UI** | \`http://${ALB_HOSTNAME}/\` | Public Access |
          | **Argo CD UI** | Port-forward: \`kubectl port-forward -n argocd svc/argo-cd-argocd-server 8080:443\` | User: \`admin\` \| Password: \`${ARGO_PASS}\` |
          | **Grafana** | Port-forward: \`kubectl port-forward -n monitoring svc/prometheus-stack-grafana 3000:80\` | User: \`admin\` \| Pass: \`admin123\` |
          | **Catalog API** | \`http://${ALB_HOSTNAME}/api/catalog\` | REST Endpoint |
          | **Auth API** | \`http://${ALB_HOSTNAME}/api/auth\` | JWT Auth |
          | **Booking API** | \`http://${ALB_HOSTNAME}/api/bookings\` | Redis Holds |
          | **Payment API** | \`http://${ALB_HOSTNAME}/api/payments\` | Ledger Events |

          ---

          ### 📦 Kubernetes Workload Status
          #### Argo CD GitOps Status:
          \`\`\`text
          $(kubectl get applications.argoproj.io -n argocd 2>/dev/null || true)
          \`\`\`

          #### CinePass Microservices (\`cinepass-dev\`):
          \`\`\`text
          $(kubectl get pods -n cinepass-dev -o wide 2>/dev/null || true)
          \`\`\`

          #### Observability Stack (\`monitoring\`):
          \`\`\`text
          $(kubectl get pods -n monitoring 2>/dev/null || true)
          \`\`\`

          ---
          > 💡 **Quick Local Connection Command:**
          > \`aws eks update-kubeconfig --region ap-south-2 --name cinepass-dev-eks\`
          EOF

      - name: Terraform Destroy
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}"
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name cinepass-dev-eks || true

          echo ">>> [1/4] Removing Argo CD application finalizers..."
          kubectl patch application cinepass-dev -n argocd -p '{"metadata":{"finalizers":null}}' --type=merge || true
          kubectl delete application cinepass-dev -n argocd --ignore-not-found || true

          echo ">>> [2/4] Deleting Ingress and Namespaces..."
          kubectl delete ingress --all -A --ignore-not-found || true
          kubectl delete namespace cinepass-dev --ignore-not-found || true

          echo ">>> [3/4] Checking and deleting any lingering ALBs..."
          ALB_ARNS=$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancers[?contains(LoadBalancerName, 'cinepass')].LoadBalancerArn" --output text 2>/dev/null || true)
          for arn in $ALB_ARNS; do
            if [ -n "$arn" ]; then
              echo "Deleting lingering ALB: $arn"
              aws elbv2 delete-load-balancer --load-balancer-arn "$arn" --region ${{ env.AWS_REGION }} || true
            fi
          done

          echo ">>> [4/4] Waiting 20s for ENI detachment and running Terraform Destroy..."
          sleep 20
          terraform destroy -auto-approve
