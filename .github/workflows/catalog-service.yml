name: "CI/CD: Catalog Service"

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ap-south-2
  ROLE_TO_ASSUME: arn:aws:iam::304960798044:role/cinepass-dev-github-actions-role
  ECR_REPOSITORY: cinepass/catalog-service
  EKS_CLUSTER_NAME: cinepass-dev-eks
  SERVICE_DIR: services/catalog-service

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Continuous Integration (Lint, Typecheck & Compile)
  # ---------------------------------------------------------------------------
  test-and-build:
    name: "Test & Compile TypeScript"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ env.SERVICE_DIR }}/package-lock.json'

      - name: Install Dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      - name: Compile TypeScript
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 2: Continuous Delivery (Docker Build, ECR Push & EKS Rollout)
  # ---------------------------------------------------------------------------
  deploy:
    name: "Build Container & Deploy to EKS"
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials via OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Rolling Deploy to EKS Cluster
        run: |
          kubectl set image deployment/catalog-service \
            catalog-service=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -n cinepass-dev
          kubectl rollout status deployment/catalog-service -n cinepass-dev --timeout=180s
