name: "GitOps CI: Catalog Service"

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: write   # Required to commit GitOps manifest updates

env:
  AWS_REGION: ap-south-2
  ROLE_TO_ASSUME: arn:aws:iam::304960798044:role/cinepass-dev-github-actions-role
  ECR_REPOSITORY: cinepass/catalog-service
  EKS_CLUSTER_NAME: cinepass-dev-eks
  SERVICE_DIR: services/catalog-service
  SERVICE_NAME: catalog-service
  MANIFEST_FILE: k8s/manifests/02-catalog-service.yaml

jobs:
  ci:
    name: "Lint, Typecheck & Build Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Typecheck TypeScript
        run: npm run build

  gitops-delivery:
    name: "Build Container & GitOps Manifest Update"
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps Manifest Tag
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Updating ${{ env.MANIFEST_FILE }} with $IMAGE_URI"
          sed -i -E "s|image: .*${{ env.ECR_REPOSITORY }}:.*|image: $IMAGE_URI|" ${{ env.MANIFEST_FILE }}
          git diff ${{ env.MANIFEST_FILE }}

      - name: Commit & Push GitOps Manifest (Triggers Argo CD Sync)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_FILE }}
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore(gitops): promote ${{ env.SERVICE_NAME }} image to ${{ github.sha }} [skip ci]"
            git push origin main
          fi

      - name: Generate GitOps Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 GitOps Continuous Delivery Summary: Catalog Service

          | Property | Value |
          |:---|:---|
          | **Microservice** | `catalog-service` (Port 8081) |
          | **ECR Image** | `${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}` |
          | **GitOps Target File** | `${{ env.MANIFEST_FILE }}` |
          | **GitOps Engine** | **Argo CD** (`argocd` namespace in `${{ env.EKS_CLUSTER_NAME }}`) |
          | **Sync Model** | **Declarative Pull (Automated Self-Heal)** |

          ### 🔄 Argo CD Reconciliation Flow
          1. GitHub Actions pushed new container image to Amazon ECR.
          2. Updated image tag in Git manifest (`${{ env.MANIFEST_FILE }}`).
          3. Argo CD controller watches this repository and automatically synchronizes the new deployment to EKS without external cluster credentials.
          EOF
